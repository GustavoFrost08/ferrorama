<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - TrainFerro</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/relatorios.css">
</head>
<body>

    <header class="hdr">
        <div>
            <img src="../assets/logo.png" alt="Logo TrainFerro">
        </div>

        <nav class="tabelas-nav">
            <a href="../html/dashboard.html" class="tab-btn">Home</a>
            <a href="../html/trens.html" class="tab-btn">Trens</a>
            <a href="../html/sensores.html" class="tab-btn">Sensores</a>
            <a href="../html/relatorios.html" class="tab-btn ativo">Relatórios</a>
            <a href="../html/usuarios.html" class="tab-btn">Usuários</a>
        </nav>

        <div>
            <button class="btn-conta">Minha Conta</button>
        </div>
    </header>

    <main class="box_maior">

        <div class="container_esq">

            <!-- filtros superiores -->
            <div class="filtros_topo">
                <input type="date" id="dataInicio" class="input_data">
                <input type="date" id="dataFim" class="input_data">
                <select class="select_filtro">
                    <option value="trem">Por trem</option>
                </select>
                <select class="select_filtro" id="filtroTrem">
                    <option value="todos">Todos os trens</option>
                </select>
            </div>

            <!-- cards de status + botão de gerar relatório -->
            <div class="linha_cima">
                <div class="frota">
                    <div class="img_status"></div>
                    <div class="text_frota"></div>
                </div>
                <div class="frota">
                    <div class="img_status"></div>
                    <div class="text_frota"></div>
                </div>
                <div class="frota">
                    <div class="img_status"></div>
                    <div class="text_frota"></div>
                </div>
                <div class="frota">
                    <div class="img_status"></div>
                    <div class="text_frota"></div>
                </div>

                <button class="btn_gerar_relatorio">
                    <span class="icon_relatorio">📄</span>
                    GERAR RELATÓRIO
                </button>
            </div>

            <!-- gráfico de ocorrências + gráfico de rosca -->
            <div class="linha_graficos">

                <!-- gráfico de linha -->
                <div class="grafico_box_linha">
                    <div class="grafico_header">
                        <h2>OCORRÊNCIAS POR DIA</h2>
                    </div>
                    <div class="area_grafico_linha">
                        <canvas id="graficoOcorrencias"></canvas>
                    </div>
                </div>

                <!-- gráfico de rosca -->
                <div class="grafico_box_rosca">
                    <h2>OCORRÊNCIAS POR TIPO</h2>
                    <div class="area_grafico_rosca">
                        <canvas id="graficoRosca"></canvas>
                    </div>
                </div>

            </div>

            <!-- tabela de resumo e filtros de busca -->
            <div class="container_baixo">
                <div class="tabela_header_filtros">
                    <h2>TODOS OS SENSORES</h2>

                    <div class="box_filtros">
                        <input type="text" id="buscaTabela" placeholder="Buscar por trem..." class="input_busca">
                        <select id="tabelaFiltroTrem">
                            <option value="todos">Todos os trens</option>
                        </select>
                        <select id="tabelaFiltroStatus">
                            <option value="todos">Todos os status</option>
                            <option value="normal">Normal</option>
                            <option value="atencao">Atenção</option>
                            <option value="critico">Crítico</option>
                        </select>
                    </div>
                </div>

                <div class="box_tabela">
                    <table>
                        <!-- preenchida pelo JS -->
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/relatorios.js"></script>
</body>
</html>
